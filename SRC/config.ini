# WIRELESS_PDF — the SoundBase PDF frequency report importer as a worker.
# Published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/wireless_pdf/config
[wireless_pdf]
# How this is raised (contracts/DISCOVERY-LIFECYCLE.md, stage 2): compose = up for as
# long as its stack is up; the discovery engine does not supervise it.
raise = compose
enabled = true
# A job arrives on APK.audio/System/Protocols/wireless_pdf/outgoing/job (not
# retained) as JSON: {"job_id": "...", "filename": "SB PDF.pdf", "content_b64": "..."}
# — a PDF is binary, so "content_b64" ("text" is accepted by the envelope but a
# PDF does not survive being sent as text). The answer goes to
# APK.audio/System/Protocols/wireless_pdf/incoming/result (not retained),
# carrying the same job_id.
# A job whose PDF is larger than this many bytes is answered with an error
# rather than parsed. 16 MiB is far beyond any report seen (the fixture,
# importer/fixtures/SB PDF.pdf, is 86 KB).
max_job_bytes = 16777216
# Every carrier an imported file names is said under
# APK.audio/System/Protocols/wireless_pdf/Device/<id>/<leaf> (ROAD-3519,
# src/carriers.rs): unkept, again every restate_s seconds, and sighted for
# presence at APK.audio/Discovery/wireless_pdf/<deviceId>. A file's carriers last
# until the same file is imported again or the worker restarts.
restate_s = 30
# Presence is the runner's: these two keys start its tracker. A carrier not
# restated for this long (a restarted worker forgets its imports) is offline.
presence_protocols = wireless_pdf
presence_inactive_after_s = 90
