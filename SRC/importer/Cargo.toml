# apkaudio-wireless-soundbase-pdf — the SoundBase PDF frequency report parser, as a crate.
#
# Owns: the SoundBase PDF dialect — positioned glyphs out of the PDF
# (pdf-extract's OutputDev), lines and words out of the glyphs, and rows out of
# the words by the report's own header row. Pure: no bus, no runner.
#
# ONE RECORD OUT: a row is DATATYPE.wireless.SOUNDbase's `SoundbaseChannel` and
# the whole parse its `SoundbaseParseResult` (that crate, by git rev), so a
# SoundBase report reads the same whether it arrived as the CSV export or as
# the PDF. The band rule and the status word are the wireless kernel's
# (apkaudio-wireless-kernel, DATATYPE.wireless.CSV/SRC/kernel, by git rev) —
# the same revs the SoundBase worker pins, so one copy of each in the lock.
[package]
name = "apkaudio-wireless-soundbase-pdf"
version = "2.0.0"
edition = "2021"

[lib]
name = "apkaudio_wireless_soundbase_pdf"
path = "src/lib.rs"

[dependencies]
apkaudio-wireless-kernel = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.CSV", rev = "235ab6df3eaf8cad3d8b5a01bbc01cb9aa0806bb" }
apkaudio-wireless-soundbase = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.SOUNDbase", rev = "4a7125d6f1a3b85ceb99484e81aed6f06d6d1083" }
pdf-extract = "0.7"

[dev-dependencies]
csv = "1.3"
